 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/video-call-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>quikchat</title>
    <meta name="description" content="Chat instantly with anyone, anywhere — quikchat.live" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://quikchat.live/" />

    <!-- Open Graph / Facebook, WhatsApp, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="quikchat" />
    <meta property="og:title" content="quikchat" />
    <meta property="og:description" content="Chat instantly with anyone, anywhere." />
    <meta property="og:url" content="https://quikchat.live/" />
    <meta property="og:image" content="https://quikchat.live/video-call-logo.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="quikchat" />
    <meta name="twitter:description" content="Chat instantly with anyone, anywhere." />
    <meta name="twitter:image" content="https://quikchat.live/video-call-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
